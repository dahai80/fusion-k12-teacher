name: docs

on:
  pull_request:
    paths:
      - "**.md"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate docs contract
        run: |
          python3 ci/validate_docs.py --root . --product fusion-k12-teacher \
            --class app --entry guided-ui \
            --skip-dirs ".git,vendor,node_modules,.venv,.ruff_cache,fusion_k12_teacher.egg-info,.atomcode,.remember,data,train,eval,__pycache__,htmlcov,.github"

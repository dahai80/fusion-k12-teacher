version: "3.8"

services:
  fusion-k12:
    build: .
    ports:
      - "8900:8900"
    environment:
      - FUSION_MLX_URL=http://fusion-mlx:8000
    depends_on:
      - fusion-mlx
    restart: unless-stopped

  fusion-mlx:
    image: fusion-mlx:latest
    ports:
      - "8000:8000"
    volumes:
      - mlx-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  mlx-models:

version: "3.8"

services:
  fusion-k12:
    build: .
    ports:
      - "11448:11448"
    environment:
      - FUSION_MLX_URL=http://fusion-mlx:11434
    depends_on:
      - fusion-mlx
    restart: unless-stopped

  fusion-mlx:
    image: fusion-mlx:latest
    ports:
      - "11434:11434"
    volumes:
      - mlx-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  mlx-models:

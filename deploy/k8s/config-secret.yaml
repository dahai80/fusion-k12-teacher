# 非敏感配置 (ConfigMap) + 敏感凭据 (Secret)
# Secret 值用 base64 占位, 生产用 sealed-secrets/external-secrets/Vault 注入
apiVersion: v1
kind: ConfigMap
metadata:
  name: k12-config
  namespace: fusion-k12
data:
  FUSION_K12_MODE: "cluster"
  FUSION_MLX_URL: "http://fusion-gateway:11432/v1"
  FUSION_MLX_MODEL: "Qwen3.5-9B-4bit"
  FUSION_MLX_MAX_CONCURRENCY: "4"
  FUSION_MLX_CONNECT_TIMEOUT: "10"
  FUSION_MLX_READ_TIMEOUT: "120"
  FUSION_K12_RATE_WINDOW: "60"
  FUSION_K12_RATE_MAX: "60"
  FUSION_K12_LOG_LEVEL: "INFO"
  FUSION_K12_DRAIN_TIMEOUT: "30"
  FUSION_K12_PG_DSN: "postgresql://k12:CHANGE@postgres:5432/k12"
  FUSION_K12_REDIS_URL: "redis://redis:6379/0"
  FUSION_K12_TASK_LOCK_TTL: "300"
---
apiVersion: v1
kind: Secret
metadata:
  name: k12-secret
  namespace: fusion-k12
type: Opaque
stringData:
  # 生产环境勿用 stringData 明文, 改 data + base64, 或外部密钥管理
  FUSION_K12_API_KEY: "CHANGE-ME-API-KEY"
  FUSION_K12_ADMIN_API_KEY: "CHANGE-ME-ADMIN-KEY"
  FUSION_MLX_API_KEY: "CHANGE-ME-GATEWAY-BEARER"
  FUSION_K12_SALT: "CHANGE-ME-32-CHAR-RANDOM-SALT"

[project]
name = "fusion-k12-teacher"
version = "1.0.4"
description = "Fusion-K12-Teacher — Local AI-powered K-12 education assistant. macOS Apple Silicon native, 100% offline, powered by fusion-mlx."
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
core = ["fusion-core>=0.1.0"]
test = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "pytest-cov>=5.0.0"]
web = ["fastapi>=0.104.0", "uvicorn>=0.24.0"]

[project.scripts]
fusion-k12 = "fusion_k12_teacher.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "PIE", "RUF"]
ignore = [
    "BLE001",  # blind-except: 有意为之的优雅降级模式（捕获异常返回默认 dataclass）
    "DTZ005",  # datetime tz: 本地离线工具，时区非关键
    "S110",    # try-except-pass: 降级路径
    "C401",    # generator-set: 可读性优先
    "PERF102", # dict-iterator: 与现有风格一致
    "RUF001",  # ambiguous-unicode: 中文标点（，：）误报
    "RUF002",  # ambiguous-unicode-docstring: 中文 docstring 误报
    "RUF003",  # ambiguous-unicode-comment: 中文注释误报
    "E501",    # line-too-long: 中文行宽按字符数，100 列易超
]

[tool.setuptools.packages.find]
include = ["fusion_k12_teacher*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"